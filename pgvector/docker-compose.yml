version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg18
    container_name: pgvector-db
    environment:
      POSTGRES_DB: vectordb           # Default database name
      POSTGRES_USER: postgres          # Default username
      POSTGRES_PASSWORD: secret        # Change this in production!
    ports:
      - "5432:5432"                   
    volumes:
      - pgvector_data:/var/lib/postgresql18/data  
    restart: unless-stopped          
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgvector_data:                     
