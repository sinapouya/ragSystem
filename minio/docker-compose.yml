version: '3.8'

services:
  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z-cpuv1
    container_name: docs_minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"   # API port
      - "9001:9001"   # Console (Web UI)
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped
  minio-client:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z-cpuv1
    container_name: docs_minio_client
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set docs-minio http://minio:9000 minioadmin minioadmin123;
      mc mb docs-minio/docs-documents --ignore-existing;
      echo '✅ Bucket "docs-documents" is ready!';
      tail -f /dev/null
      "
volumes:
  minio_data:
    driver: local