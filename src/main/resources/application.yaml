spring:
  application:
    name: ragApplication
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: llama3.2:3b
          temperature: 0.7
      embedding:
        options:
          model: nomic-embed-text
    model:
      embedding: ollama

  datasource:
    url: jdbc:postgresql://localhost:5432/vectordb
    username: postgres
    password: secret
server:
  port: 8080
logging:
  level:
    org.springframework.ai: DEBUG